<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Receptionist Engine</title>
<style>
  /* ======================================================================
     ENGINE STYLING — same for every shop. Nothing in here should ever
     need to change per customer.
     ====================================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  .chat-header {
    padding: 1.25rem 2rem; border-bottom: 1px solid #222;
    display: flex; align-items: center; gap: 8px;
  }
  .status-dot { width: 6px; height: 6px; background: #5a9e00; border-radius: 50%; }
  .chat-header-title { font-size: 12px; color: #666; }
  .chat-area {
    flex: 1; overflow-y: auto; padding: 2rem;
    display: flex; flex-direction: column; gap: 12px;
  }
  .message { display: flex; gap: 8px; margin-bottom: 4px; }
  .message.user { justify-content: flex-end; }
  .msg-bubble {
    background: #1a1a1a; padding: 12px 16px; border-radius: 8px;
    max-width: 65%; font-size: 13px; line-height: 1.6; color: #ccc;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .message.user .msg-bubble { color: #fff; background: #262626; }
  .quick-questions { display: flex; flex-direction: column; gap: 8px; margin: 1rem 0; }
  .quick-label { font-size: 11px; color: #666; font-weight: 500; }
  .quick-btn {
    text-align: left; padding: 10px 12px; background: #1a1a1a; color: #ccc;
    border: 1px solid #222; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .quick-btn:hover { border-color: #333; background: #222; }
  .input-area {
    padding: 1.25rem 2rem; border-top: 1px solid #222;
    display: flex; gap: 8px;
  }
  .input-area input {
    flex: 1; padding: 12px 14px; background: #1a1a1a; border: 1px solid #222;
    border-radius: 6px; color: #fff; font-size: 13px;
  }
  .send-btn {
    background: #222; color: #ccc; border: 1px solid #222; padding: 12px 18px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .config-warning {
    background: #3a2a12; color: #f0b429; font-size: 12px; padding: 10px 2rem;
    display: none;
  }
</style>
</head>
<body>

<div class="config-warning" id="configWarning">
  Couldn't load shop-config.json (this happens if you open this file directly instead of
  serving it — e.g. from a file:// path). Falling back to built-in placeholder data so you
  can still see it work. On Replit / any real server this loads automatically.
</div>

<div class="chat-header">
  <div class="status-dot"></div>
  <span class="chat-header-title" id="headerTitle">Loading…</span>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="input-area">
  <input type="text" id="chatInput" placeholder="Type a message..." />
  <button class="send-btn" onclick="handleChat()">Send</button>
</div>

<script>
/* ============================================================================
   ENGINE LOGIC — this whole script is shop-agnostic. It never references
   "Smoking Valley" or any specific product by name. Everything it needs
   comes from shopConfig, loaded below. To run this for a different shop,
   you swap shop-config.json — you never edit anything past this comment.
   ============================================================================ */

// Minimal built-in fallback so the file still demos something if
// shop-config.json can't be fetched (e.g. opened as a local file with no server).
const FALLBACK_CONFIG = {
  identity: {
    display_name: "Demo Shop",
    address: "123 Example St",
    hours_display: "Open daily 9am - 9pm",
    greeting_message: "Hi! This is placeholder data — shop-config.json didn't load."
  },
  compliance: { require_age_verification: false },
  products: { categories: [] },
  quick_questions: ["What are your hours?", "Where are you located?"]
};

let shopConfig = null;
let awaitingAgeVerification = false;

async function loadConfig() {
  try {
    const res = await fetch('./shop-config.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    shopConfig = await res.json();
  } catch (err) {
    document.getElementById('configWarning').style.display = 'block';
    shopConfig = FALLBACK_CONFIG;
  }
  startEngine();
}

function startEngine() {
  const pos = shopConfig.pos_connection;
  const syncedTag = (pos && pos.connected) ? ' • 🔄 Square synced (sample)' : '';
  document.getElementById('headerTitle').textContent =
    (shopConfig.identity.display_name || 'Shop') + ' • Online now' + syncedTag;

  if (shopConfig.compliance && shopConfig.compliance.require_age_verification) {
    awaitingAgeVerification = true;
    addMessage(shopConfig.compliance.verification_prompt, 'bot');
    renderYesNo();
  } else {
    greetAndStart();
  }
}

function greetAndStart() {
  addMessage(shopConfig.identity.greeting_message, 'bot');
  renderQuickQuestions(null);
}

function renderYesNo() {
  const chatArea = document.getElementById('chatArea');
  const container = document.createElement('div');
  container.className = 'quick-questions';
  container.id = 'ageGateButtons';
  const yes = document.createElement('button');
  yes.className = 'quick-btn';
  yes.textContent = "Yes, I'm 21 or older";
  yes.onclick = () => answerAgeGate(true);
  const no = document.createElement('button');
  no.className = 'quick-btn';
  no.textContent = "No";
  no.onclick = () => answerAgeGate(false);
  container.appendChild(yes);
  container.appendChild(no);
  chatArea.appendChild(container);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function answerAgeGate(isOfAge) {
  document.getElementById('ageGateButtons').remove();
  addMessage(isOfAge ? "Yes, I'm 21 or older" : "No", 'user');
  awaitingAgeVerification = false;
  if (isOfAge) {
    greetAndStart();
  } else {
    addMessage(shopConfig.compliance.verification_fail_message, 'bot');
    document.getElementById('chatInput').disabled = true;
  }
}

function handleChat() {
  if (awaitingAgeVerification) return; // must use the buttons
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const qq = document.getElementById('quickQuestions');
  if (qq) qq.style.display = 'none';
  addMessage(text, 'user');
  input.value = '';
  setTimeout(() => respondToQuery(text), 250);
}

function handleQuickQuestion(question) {
  const qq = document.getElementById('quickQuestions');
  if (qq) qq.style.display = 'none';
  addMessage(question, 'user');
  setTimeout(() => respondToQuery(question), 250);
}

function addMessage(text, sender) {
  const chatArea = document.getElementById('chatArea');
  const msg = document.createElement('div');
  msg.className = sender === 'user' ? 'message user' : 'message';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function renderQuickQuestions(excludeQuestion) {
  const chatArea = document.getElementById('chatArea');
  const pool = (shopConfig.quick_questions || []).filter(q => q !== excludeQuestion);
  const shuffled = [...pool].sort(() => 0.5 - Math.random());
  const selected = shuffled.slice(0, 4);
  if (selected.length === 0) return;

  const container = document.createElement('div');
  container.className = 'quick-questions';
  container.id = 'quickQuestions';
  const label = document.createElement('p');
  label.className = 'quick-label';
  label.textContent = excludeQuestion ? 'More questions:' : 'Quick questions:';
  container.appendChild(label);
  selected.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = q;
    btn.onclick = () => handleQuickQuestion(q);
    container.appendChild(btn);
  });
  chatArea.appendChild(container);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// This is the one function that "knows about" products — and it only
// knows about them through shopConfig.products.categories, never by name.
function respondToQuery(query) {
  const text = query.toLowerCase();
  const identity = shopConfig.identity;
  const categories = [...((shopConfig.products && shopConfig.products.categories) || [])];

  // If Square is connected, its synced items are just another category to the
  // engine — this is the seam where a real Catalog API pull replaces mock_catalog
  // with live items, without anything else here changing.
  const pos = shopConfig.pos_connection;
  if (pos && pos.connected && pos.mock_catalog && pos.mock_catalog.length) {
    categories.push({
      key: 'square_synced',
      label: 'Live Inventory (synced from Square)',
      keywords: ['square', 'live', 'synced', 'inventory', 'stock'],
      items: pos.mock_catalog
    });
  }

  let response = null;

  // Try to match a product category by its configured keywords
  for (const cat of categories) {
    const matched = (cat.keywords || []).some(k => text.includes(k.toLowerCase()));
    if (matched) {
      response = `Here's what we have in ${cat.label}:\n\n`;
      (cat.items || []).forEach((item, i) => {
        response += `${i + 1}. ${item.name} - ${item.price}\n   ${item.details || ''}\n\n`;
      });
      break;
    }
  }

  if (!response && (text.includes('hour') || text.includes('open') || text.includes('close'))) {
    response = `⏰ ${identity.hours_display}`;
  }
  if (!response && (text.includes('address') || text.includes('location') || text.includes('where'))) {
    response = `📍 ${identity.address}`;
  }
  if (!response && (text.includes('hi') || text.includes('hello') || text.includes('hey'))) {
    response = 'Hey! What can I help you find today?';
  }
  if (!response) {
    const categoryList = categories.map(c => `✓ ${c.label}`).join('\n');
    response = `I can help with:\n\n${categoryList}\n✓ Hours & location\n\nWhat are you interested in?`;
  }

  addMessage(response, 'bot');
  renderQuickQuestions(query);
}

document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && document.activeElement.id === 'chatInput') handleChat();
});

loadConfig();
</script>

</body>
</html>
