<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Receptionist Engine</title>
<style>
  /* ======================================================================
     ENGINE STYLING — same for every shop. Nothing in here should ever
     need to change per customer.
     ====================================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  .chat-header {
    padding: 1.25rem 2rem; border-bottom: 1px solid #222;
    display: flex; align-items: center; gap: 8px;
  }
  .status-dot { width: 6px; height: 6px; background: #5a9e00; border-radius: 50%; }
  .chat-header-title { font-size: 12px; color: #666; }
  .chat-area {
    flex: 1; overflow-y: auto; padding: 2rem;
    display: flex; flex-direction: column; gap: 12px;
  }
  .message { display: flex; gap: 8px; margin-bottom: 4px; }
  .message.user { justify-content: flex-end; }
  .msg-bubble {
    background: #1a1a1a; padding: 12px 16px; border-radius: 8px;
    max-width: 65%; font-size: 13px; line-height: 1.6; color: #ccc;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .message.user .msg-bubble { color: #fff; background: #262626; }
  .quick-questions { display: flex; flex-direction: column; gap: 8px; margin: 1rem 0; }
  .quick-label { font-size: 11px; color: #666; font-weight: 500; }
  .quick-btn {
    text-align: left; padding: 10px 12px; background: #1a1a1a; color: #ccc;
    border: 1px solid #222; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .quick-btn:hover { border-color: #333; background: #222; }
  .input-area {
    padding: 1.25rem 2rem; border-top: 1px solid #222;
    display: flex; gap: 8px;
  }
  .input-area input {
    flex: 1; padding: 12px 14px; background: #1a1a1a; border: 1px solid #222;
    border-radius: 6px; color: #fff; font-size: 13px;
  }
  .send-btn {
    background: #222; color: #ccc; border: 1px solid #222; padding: 12px 18px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .config-warning {
    background: #3a2a12; color: #f0b429; font-size: 12px; padding: 10px 2rem;
    display: none;
  }
</style>
</head>
<body>

<div class="config-warning" id="configWarning">
  Couldn't load shop-config.json (this happens if you open this file directly instead of
  serving it — e.g. from a file:// path). Falling back to built-in placeholder data so you
  can still see it work. On Replit / any real server this loads automatically.
</div>

<div class="chat-header">
  <div class="status-dot"></div>
  <span class="chat-header-title" id="headerTitle">Loading…</span>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="input-area">
  <input type="text" id="chatInput" placeholder="Type a message..." />
  <button class="send-btn" onclick="handleChat()">Send</button>
</div>

<script>
/* ============================================================================
   ENGINE LOGIC — shop-agnostic, same as before. The one architectural change:
   this file no longer fetches the full shop-config.json (which used to include
   the entire product catalog, visible in the page before anyone answered the
   age question). It now only knows a shop's name, hours, and the verification
   prompt text — GET /api/shop-info. Everything about products goes through
   POST /api/chat, which the server refuses to answer unless a valid,
   server-issued age-verification token is attached. The catalog itself never
   reaches this page until that check has passed on the server.
   ============================================================================ */

// Minimal built-in fallback so the file still shows something if the backend
// can't be reached at all (e.g. opened as a local file with no server).
const FALLBACK_INFO = {
  identity: {
    display_name: "Demo Shop",
    address: "123 Example St",
    hours_display: "Open daily 9am - 9pm",
    greeting_message: "Hi! This is placeholder data — the backend didn't respond."
  },
  compliance: { require_age_verification: false },
  quick_questions: ["What are your hours?", "Where are you located?"]
};

let shopInfo = null;
let awaitingAgeVerification = false;
let ageToken = null; // held in memory only — cleared on refresh, same as before

async function loadConfig() {
  try {
    const res = await fetch('./api/shop-info', { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    shopInfo = await res.json();
  } catch (err) {
    document.getElementById('configWarning').style.display = 'block';
    shopInfo = FALLBACK_INFO;
  }
  startEngine();
}

function startEngine() {
  document.getElementById('headerTitle').textContent =
    (shopInfo.identity.display_name || 'Shop') + ' • Online now';

  if (shopInfo.compliance && shopInfo.compliance.require_age_verification) {
    awaitingAgeVerification = true;
    addMessage(shopInfo.compliance.verification_prompt, 'bot');
    renderYesNo();
  } else {
    greetAndStart();
  }
}

function greetAndStart() {
  addMessage(shopInfo.identity.greeting_message, 'bot');
  renderQuickQuestions(null);
}

function renderYesNo() {
  const chatArea = document.getElementById('chatArea');
  const container = document.createElement('div');
  container.className = 'quick-questions';
  container.id = 'ageGateButtons';
  const yes = document.createElement('button');
  yes.className = 'quick-btn';
  yes.textContent = "Yes, I'm 21 or older";
  yes.onclick = () => answerAgeGate(true);
  const no = document.createElement('button');
  no.className = 'quick-btn';
  no.textContent = "No";
  no.onclick = () => answerAgeGate(false);
  container.appendChild(yes);
  container.appendChild(no);
  chatArea.appendChild(container);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// This now calls the server — the actual pass/fail decision, the audit log
// entry, and the token that unlocks /api/chat are all issued server-side.
// The browser can't forge a "yes" for itself; it can only ask the server for one.
async function answerAgeGate(isOfAge) {
  document.getElementById('ageGateButtons').remove();
  addMessage(isOfAge ? "Yes, I'm 21 or older" : "No", 'user');
  awaitingAgeVerification = false;

  try {
    const res = await fetch('./api/verify-age', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirmed: isOfAge })
    });
    const data = await res.json();

    if (data.verified) {
      ageToken = data.token;
      greetAndStart();
    } else {
      addMessage(data.message || shopInfo.compliance.verification_fail_message, 'bot');
      document.getElementById('chatInput').disabled = true;
    }
  } catch (err) {
    addMessage('Something went wrong verifying your age — please refresh and try again.', 'bot');
    document.getElementById('chatInput').disabled = true;
  }
}

function handleChat() {
  if (awaitingAgeVerification) return; // must use the buttons
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const qq = document.getElementById('quickQuestions');
  if (qq) qq.style.display = 'none';
  addMessage(text, 'user');
  input.value = '';
  setTimeout(() => respondToQuery(text), 250);
}

function handleQuickQuestion(question) {
  const qq = document.getElementById('quickQuestions');
  if (qq) qq.style.display = 'none';
  addMessage(question, 'user');
  setTimeout(() => respondToQuery(question), 250);
}

// Sends the message to the server and renders whatever comes back. This is
// now the ONLY place product/pricing info can enter the page — it lives on
// the server and is returned per-question, never loaded up front.

function addMessage(text, sender) {
  const chatArea = document.getElementById('chatArea');
  const msg = document.createElement('div');
  msg.className = sender === 'user' ? 'message user' : 'message';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function renderQuickQuestions(excludeQuestion) {
  const chatArea = document.getElementById('chatArea');
  const pool = (shopInfo.quick_questions || []).filter(q => q !== excludeQuestion);
  const shuffled = [...pool].sort(() => 0.5 - Math.random());
  const selected = shuffled.slice(0, 4);
  if (selected.length === 0) return;

  const container = document.createElement('div');
  container.className = 'quick-questions';
  container.id = 'quickQuestions';
  const label = document.createElement('p');
  label.className = 'quick-label';
  label.textContent = excludeQuestion ? 'More questions:' : 'Quick questions:';
  container.appendChild(label);
  selected.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = q;
    btn.onclick = () => handleQuickQuestion(q);
    container.appendChild(btn);
  });
  chatArea.appendChild(container);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// This is the one function that "knows about" products — and it only
// knows about them by asking the server via /api/chat, never by name.
async function respondToQuery(query) {
  try {
    const res = await fetch('./api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: query, token: ageToken })
    });

    if (res.status === 403) {
      // Token missing, expired, or invalid — the server won't say more than
      // that, and the browser shouldn't guess why. Re-run the age gate.
      addMessage("Let's confirm your age again before continuing.", 'bot');
      awaitingAgeVerification = true;
      if (shopInfo && shopInfo.compliance) {
        addMessage(shopInfo.compliance.verification_prompt, 'bot');
      }
      renderYesNo();
      return;
    }

    const data = await res.json();
    addMessage(data.response || "Sorry, I didn't catch that — could you rephrase?", 'bot');
    renderQuickQuestions(query);
  } catch (err) {
    addMessage("Sorry, I'm having trouble connecting right now — please try again in a moment.", 'bot');
  }
}

document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && document.activeElement.id === 'chatInput') handleChat();
});

loadConfig();
</script>

</body>
</html>
